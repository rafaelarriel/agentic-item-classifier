services:
  mcp-server:
    build: .
    command: python -m app.mcp.server
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8001"
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"

  classifier-api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Configure OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      CLASSIFIER_BATCH_SIZE: ${CLASSIFIER_BATCH_SIZE:-20}
      MAX_CONCURRENT_BATCHES: ${MAX_CONCURRENT_BATCHES:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mcp-server
    ports:
      - "8000:8000"
